[project]
name = "codetest-mcp"
version = "0.1.0"
description = "Code Review AI Agent - AST & Linter MCP Server (Headless)"
requires-python = ">=3.10"

dependencies = [
    "mcp>=1.2",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.2",
]

[project.optional-dependencies]
# 실제 린터가 설치되어 있으면 자동으로 사용한다 (없으면 내장 규칙으로 폴백)
linters = ["ruff>=0.5"]
dev = ["pytest>=8.0"]

[project.scripts]
codetest-mcp = "codetest_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codetest_mcp*"]
