[project]
name = "codetest-mcp"
version = "0.1.0"
description = "Code Test AI Agent - MCP (코드 기반 처리 전담 MCP 서버)"
requires-python = ">=3.10"

dependencies = [
    # --- MCP 서버 (Agent 가 MCP 클라이언트로 호출) ---
    "fastmcp>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # --- 프로젝트 개요 DB (Project, Graph Node/Edge) ---
    "SQLAlchemy>=2.0",

    # --- 저장소 clone ---
    "GitPython>=3.1",

    # --- AST 파싱 (LLM 토큰 미소모) ---
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.2",  # Java/JS/TS/Python/XML/SQL 문법 번들
    "lxml>=5.2",                       # MyBatis XML 파싱
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
codetest-mcp = "codetest_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codetest_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
